[workspace]
members = ["clamd_configuration", "gtk_scene_capture", "clamav_admin_service", "translation_codegen", "xtask"]

[package]
name = "lazaret"
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "lazaret"
path = "src/main.rs"

[lints.clippy]
enum_variant_names = "allow"

[dependencies]
futures = "0.3.34"
hex = "0.4"
lazaret-clamd-configuration = { version = "0.1.0", path = "clamd_configuration" }
humantime = "2.4"
ksni = "0.3.7"
oo7 = "0.6"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "rustls", "stream"] }
relm4 = { version = "0.11", features = ["libadwaita", "gnome_47"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs", "pipe", "process", "rand"] }
sha2 = "0.10"
systemd = { version = "0.11.1", default-features = false, features = ["journal"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", features = ["io-util", "process", "fs", "rt", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
turso = { version = "=0.8.3", default-features = false }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
inotify = "0.11"
icu = { version = "2.4.0", features = ["sync"] }
icu_experimental = "0.7.0"
fixed_decimal = "0.7.3"
writeable = "0.6.4"
icu_provider = "2.4.0"
jiff = { version = "0.2.39", features = ["serde"] }
icu_datetime = { version = "2.4.0", features = ["unstable_jiff_0_2"] }
bytesize = "2.7.0"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
xdg = "3.0.0"
fluent-bundle = "0.16"
fluent-langneg = "0.13"
unic-langid = "0.9"

[dev-dependencies]
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
lazaret-translation-codegen = { version = "0.1.0", path = "translation_codegen" }
