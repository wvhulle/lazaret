on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  vm-tests:
    runs-on: nix
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        extra-system-features = kvm nixos-test
        extra-substituters = https://wvhulle.cachix.org
        extra-trusted-public-keys = wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0=
    steps:
      - name: Clone the commit
        run: |
          git init --quiet
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git fetch --quiet --depth 1 origin "${{ github.sha }}"
          git checkout --quiet FETCH_HEAD

      - name: Require KVM
        run: test -r /dev/kvm -a -w /dev/kvm

      - name: Desktop user journey
        run: nix build --quiet --no-link --print-build-logs .#checks.x86_64-linux.vm-desktop-user-journey

      - name: Administrator journey
        run: nix build --quiet --no-link --print-build-logs .#checks.x86_64-linux.vm-administrator-journey
