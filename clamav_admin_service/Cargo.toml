[package]
name = "lazaret-clamav-admin"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lints.clippy]
enum_variant_names = "allow"

[package.metadata.cargo-machete]
ignored = ["lazaret-clamd-configuration"]

[dependencies]
futures = "0.3.34"
jiff = { version = "0.2.39", default-features = false, features = ["serde", "std"] }
lazaret-clamd-configuration = { version = "0.1.0", path = "../clamd_configuration" }
rustix = { version = "1", features = ["fs"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt", "time"] }
toml = "1.1"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
