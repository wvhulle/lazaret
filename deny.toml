[graph]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

[[licenses.exceptions]]
crate = "ksni"
allow = ["Unlicense"]

[[licenses.exceptions]]
crate = "libsystemd-sys"
allow = ["LGPL-2.1-or-later WITH GCC-exception-2.0"]

[[licenses.exceptions]]
crate = "systemd"
allow = ["LGPL-2.1-or-later WITH GCC-exception-2.0"]

[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
