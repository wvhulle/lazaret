[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
md-5 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "tokio"] }
gtk_scene_capture = { version = "0.1.0", path = "../gtk_scene_capture" }
tokio = { version = "1.54.1", features = ["rt", "time"] }
